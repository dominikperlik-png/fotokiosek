# Nastavení fotokiosku.
# Zkopíruj tento soubor jako config.properties, vyplň ho a spusť instalaci –
# nastavení se nahraje do automatu (a tam se soubor po načtení smaže).
# Všechno jde změnit i později v menu správce přímo na automatu.

# --- E-mail ---
# Gmail: na účtu zapni dvoufázové ověření a vytvoř „heslo pro aplikace“
#        na https://myaccount.google.com/apppasswords (16 písmen).
# Seznam: smtp.seznam.cz, 465, SSL, celá adresa + heslo ke schránce.
# Brevo:  smtp-relay.brevo.com, 587, STARTTLS, přihlašovací jméno a SMTP klíč z Brevo.
# Firemní e-mail (vlastní doména): server/port od poskytovatele, např. smtp.firma.cz 465 SSL
#         nebo Microsoft 365: smtp.office365.com, 587, STARTTLS. from_address = firemní adresa
#         (musí to být přihlašovací schránka nebo její povolený alias).
smtp_host=smtp.gmail.com
smtp_port=465
smtp_security=SSL
smtp_user=
smtp_password=
# prázdné = stejná adresa jako smtp_user
from_address=
from_name=Fotokoutek
# Kam chodí odpovědi zákazníků (prázdné = adresa odesílatele), např. info@firma.cz
reply_to=
subject=Tvoje fotka z fotokoutku
body=Ahoj,\n\nv příloze posíláme tvoji fotku z fotokoutku.\n\nDíky a měj se hezky!

# --- Kiosek ---
welcome_text=Usměj se a vyfoť se!
# PIN do menu správce (5× klepnout do levého horního rohu)
pin=1234
countdown=3
idle_timeout=45
keep_days=7
mirror=true
fill_screen=true
# prodleva spouště: o kolik ms dřív se fotí, aby fotka vznikla s nápisem „Úsměv!“
shutter_lead_ms=250

# --- Kamera ---
# auto = zrcadlovka Canon, když je připojená, jinak kamera Androidu; android; canon
camera_source=auto
# otočení obrazu zrcadlovky (0, 90, 180, 270) – když je fotoaparát na výšku
canon_rotation=0
# true = zrcadlovka uloží fotku i na SD kartu (pomalejší), false = jen do aplikace
canon_save_to_card=false
# otočení JEN živého náhledu vestavěné kamery (0/90/180/270), fotka se nemění
preview_rotation=180
# prázdné = automaticky (USB webkamera přednostně, jinak přední kamera)
camera_id=

# --- E-mail na starých Androidech ---
# true = nekontrolovat certifikát SMTP serveru (jen když test hlásí problém s certifikátem a čas je správně)
smtp_trust_all=false

# --- Tisk ---
print_enabled=false
# ipp = síťová tiskárna napřímo (doporučeno), system = tiskový dialog Androidu
print_mode=ipp
# IP adresa tiskárny nebo ipp://… (jde i vyhledat v menu správce)
printer_url=
print_max_copies=5
# selphy_cp1500 (100×148 mm), dnp_qw410 nebo generic (4×6″) – vždy 10×15 cm, 300 DPI, bez okrajů
printer_model=generic

# --- Logo ---
# Logo nahraješ v menu správce, nebo dej soubor logo.png (logo.jpg / logo.svg) vedle instalace.ps1.
logo_on_screen=true
logo_on_photo=true
# none, custom (nahrané), builtin:satisfactory, builtin:watt, builtin:allin
logo_choice=custom
# TL, TC, TR, BL, BC, BR = roh nebo střed horního/dolního okraje fotky
logo_position=BR
# šířka loga v % šířky fotky
logo_size=18

# --- Aktualizace ---
github_repo=dominikperlik-png/fotokiosek
# jen pro soukromý repozitář
github_token=
