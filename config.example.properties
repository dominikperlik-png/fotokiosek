# Nastavení fotokiosku.
# Zkopíruj tento soubor jako config.properties, vyplň ho a spusť instalaci –
# nastavení se nahraje do automatu (a tam se soubor po načtení smaže).
# Všechno jde změnit i později v menu správce přímo na automatu.

# --- E-mail ---
# Gmail: na účtu zapni dvoufázové ověření a vytvoř „heslo pro aplikace“
#        na https://myaccount.google.com/apppasswords (16 písmen).
# Seznam: smtp.seznam.cz, 465, SSL, celá adresa + heslo ke schránce.
# Brevo:  smtp-relay.brevo.com, 587, STARTTLS, přihlašovací jméno a SMTP klíč z Brevo.
smtp_host=smtp.gmail.com
smtp_port=465
smtp_security=SSL
smtp_user=
smtp_password=
# prázdné = stejná adresa jako smtp_user
from_address=
from_name=Fotokoutek
subject=Tvoje fotka z fotokoutku
body=Ahoj,\n\nv příloze posíláme tvoji fotku z fotokoutku.\n\nDíky a měj se hezky!

# --- Kiosek ---
welcome_text=Usměj se a vyfoť se!
# PIN do menu správce (5× klepnout do levého horního rohu)
pin=1234
countdown=3
idle_timeout=45
keep_days=7
mirror=true
fill_screen=true
